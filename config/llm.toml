# Unified, non-secret LLM target configuration.
#
# Provider defaults (backend id, default base URL, credential environment
# variable, and probe policy) remain centralized in the Runtime provider
# catalog. This file selects targets and applies deployment-specific overrides.
# Persistent API keys belong in the ignored sibling config/llm.local.toml.
# Environment variables remain optional per-process overrides.

schema_version = 1

[llm]
active_target = "deepseek-research"

[llm.targets.deepseek-research]
service = "deepseek"
model = "deepseek-v4-flash"
reasoning_effort = "high"
structured_output = "json_object"
target_id = "research/deepseek/deepseek-v4-flash"
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
api_probe = "models_endpoint"
capabilities = ["generation", "reasoning"]
allow_confidential_context = false
context_tokens = 4096
max_output_tokens = 8192
max_attempts = 1
max_elapsed_seconds = 180.0
reasoner_tool_intents = 1
strict_json_schema = false
allow_insecure_http = false

[llm.targets.codex-research]
service = "codex_cli"
executable = "codex"
model = "gpt-5.6-terra"
reasoning_effort = "high"
structured_output = "json_schema"
target_id = "research/codex-cli/gpt-5.6-terra"
capabilities = ["generation"]
allow_confidential_context = false
context_tokens = 4096
max_attempts = 1
max_elapsed_seconds = 300.0
reasoner_tool_intents = 0
strict_json_schema = false
allow_insecure_http = false
