[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-agent-runtime"
version = "0.1.0"
description = "A minimal runtime core for adaptive agents."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "jsonschema>=4.22,<5",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["adaptive_agent_runtime"]
